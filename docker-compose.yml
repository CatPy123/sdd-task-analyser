version: '3.8'

services:
  test-harness:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task_analyzer_ci_container
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    # Executa a suíte de testes isolada inteira com um único comando padronizado
    command: pytest tests/test_harness.py -v